name: rtl-build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator python3-venv python3-numpy

      - name: Run RTL simulation
        run: make test

      - name: Lint RTL
        run: make lint

      - name: Run synthesis smoke tests
        run: make synth

      - name: Run cocotb regression
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip 'cocotb<2'
          make cocotb

      - name: Generate activity and fault-accuracy evidence
        run: |
          make activity
          make experiment-smoke

      - name: Upload synthesis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-reports
          path: |
            build/synthesis
            build/rtl_metrics.json
            build/activity.saif
            build/fault-experiment
